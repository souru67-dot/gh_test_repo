<?xml version="1.0" encoding="UTF-8"?>
<!--
  ColorHunt app icon — master source (1024×1024, full-bleed square).
  Design: the 12-bucket hue ring (the app's colour collection) as a camera
  aperture on the brand dark base, with a white "hunt" focus dot.
  iOS applies the squircle mask automatically — do NOT round the corners here.
  Render to PNG at 1024×1024 (see README.md) and drop into AppIcon.appiconset.
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <rect width="1024" height="1024" fill="#101014"/>

  <!-- Soft ambient glow behind the ring -->
  <circle cx="512" cy="512" r="430" fill="#7C4DFF" opacity="0.10"/>
  <circle cx="512" cy="512" r="330" fill="#EC407A" opacity="0.08"/>

  <!-- 12 hue segments, 26° each with 4° gaps, red at top -->
  <path d="M525.3 132.2 A380 380 0 0 1 690.4 176.5 L629.4 291.3 A250 250 0 0 0 520.7 262.1 Z" fill="hsl(0,86%,56%)"/>
  <path d="M713.4 189.8 A380 380 0 0 1 834.2 310.6 L724.0 379.5 A250 250 0 0 0 644.5 300.0 Z" fill="hsl(30,88%,54%)"/>
  <path d="M847.5 333.6 A380 380 0 0 1 891.8 498.7 L761.9 503.3 A250 250 0 0 0 732.7 394.6 Z" fill="hsl(60,90%,50%)"/>
  <path d="M891.8 525.3 A380 380 0 0 1 847.5 690.4 L732.7 629.4 A250 250 0 0 0 761.9 520.7 Z" fill="hsl(90,80%,50%)"/>
  <path d="M834.2 713.4 A380 380 0 0 1 713.4 834.2 L644.5 724.0 A250 250 0 0 0 724.0 644.5 Z" fill="hsl(120,72%,48%)"/>
  <path d="M690.4 847.5 A380 380 0 0 1 525.3 891.8 L520.7 761.9 A250 250 0 0 0 629.4 732.7 Z" fill="hsl(150,75%,48%)"/>
  <path d="M498.7 891.8 A380 380 0 0 1 333.6 847.5 L394.6 732.7 A250 250 0 0 0 503.3 761.9 Z" fill="hsl(180,80%,50%)"/>
  <path d="M310.6 834.2 A380 380 0 0 1 189.8 713.4 L300.0 644.5 A250 250 0 0 0 379.5 724.0 Z" fill="hsl(210,88%,56%)"/>
  <path d="M176.5 690.4 A380 380 0 0 1 132.2 525.3 L262.1 520.7 A250 250 0 0 0 291.3 629.4 Z" fill="hsl(240,84%,60%)"/>
  <path d="M132.2 498.7 A380 380 0 0 1 176.5 333.6 L291.3 394.6 A250 250 0 0 0 262.1 503.3 Z" fill="hsl(270,84%,60%)"/>
  <path d="M189.8 310.6 A380 380 0 0 1 310.6 189.8 L379.5 300.0 A250 250 0 0 0 300.0 379.5 Z" fill="hsl(300,82%,58%)"/>
  <path d="M333.6 176.5 A380 380 0 0 1 498.7 132.2 L503.3 262.1 A250 250 0 0 0 394.6 291.3 Z" fill="hsl(330,86%,58%)"/>

  <!-- The hunt focus dot -->
  <circle cx="512" cy="512" r="58" fill="#FFFFFF"/>
  <circle cx="512" cy="512" r="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="10"/>
</svg>
